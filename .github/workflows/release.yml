name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: /tmp/localrepo-gradle-test-home/wrapper/dists
          key: gradle-test-${{ hashFiles('src/test/resources/gradle-wrapper/gradle-wrapper.properties') }}
      - name: Check the tag matches the version
        run: |
          version=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: ./mvnw -B verify
      - run: scripts/test-cli.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp target/server-*.jar dist/localrepo-server.jar
          cp bin/localrepo install.sh dist/
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
