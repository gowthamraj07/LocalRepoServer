name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: /tmp/localrepo-gradle-test-home/wrapper/dists
          key: gradle-test-${{ hashFiles('src/test/resources/gradle-wrapper/gradle-wrapper.properties') }}
      - run: ./mvnw -B verify
