version: 2

# Grouped on purpose: an ungrouped config opens one PR per dependency, each firing CI.
# Grouping collapses routine bumps into one PR per ecosystem; majors still arrive on
# their own so they get read properly.
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
