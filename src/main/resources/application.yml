server:
  port: 8082
  address: 127.0.0.1

spring:
  threads:
    virtual:
      enabled: true

localrepo:
  # `--repos=a,b` on the command line still works and overrides the defaults.
  upstreams: ${repos:https://repo.maven.apache.org/maven2,https://dl.google.com/dl/android/maven2}
  cache-dir: ${user.home}/.localrepo/cache
  negative-cache-ttl: 5m
  connect-timeout: 10s
  read-idle-timeout: 60s
