server:
  port: 8082
  address: 127.0.0.1

spring:
  config:
    # Your own settings; upstreams.yml is written by the Upstreams page of the UI.
    import:
      - optional:file:${localrepo.home:${user.home}/.localrepo}/config.yml
      - optional:file:${localrepo.home:${user.home}/.localrepo}/upstreams.yml
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Cache bundles uploaded from the UI can be large.
      max-file-size: -1
      max-request-size: -1

localrepo:
  home: ${user.home}/.localrepo
  cache-dir: ${localrepo.home}/cache
  negative-cache-ttl: 5m
  connect-timeout: 10s
  read-idle-timeout: 60s
  # maven-metadata.xml and -SNAPSHOT files are checked with the upstream again after this; releases never are.
  metadata-ttl: 24h
  # Never contact an upstream; also switchable at runtime with POST /api/offline.
  offline: false
  # Keep the cache under this size by deleting the least recently used files (e.g. 20GB). Unset: no limit.
  # max-size: 20GB
  # Paths never deleted by the size limit, e.g. [ "androidx/**" ].
  pinned: [ ]
  eviction-interval: 10m
  gradle-user-home: ${GRADLE_USER_HOME:${user.home}/.gradle}
  maven-settings: ${user.home}/.m2/settings.xml
  # Tried in this order by /cache/** (the group), filtered by includes/excludes. `--repos=a,b` replaces the list.
  # Add private repositories under `extra-upstreams` (same shape, tried after these) rather than replacing this list.
  # Credentials are named, never stored: environment variables or properties of the Gradle user home's
  # gradle.properties, e.g.
  #   credentials: { token-env: GITHUB_TOKEN }  or  { username-env: REPO_USER, password-env: REPO_PASSWORD }
  #   credentials: { gradle-property-username: gpr.user, gradle-property-password: gpr.key }
  upstreams:
    - name: google
      url: https://dl.google.com/dl/android/maven2
      includes: [ "androidx/**", "com/android/**", "com/google/**" ]
    - name: central
      url: https://repo.maven.apache.org/maven2
    - name: gradle-plugins
      url: https://plugins.gradle.org/m2
    - name: jetbrains-compose
      url: https://packages.jetbrains.team/maven/p/cmp/dev
      includes: [ "org/jetbrains/compose/**", "org/jetbrains/androidx/**", "org/jetbrains/skiko/**" ]
    - name: jitpack
      url: https://jitpack.io
      includes: [ "com/github/**" ]
