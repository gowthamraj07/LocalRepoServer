<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="stats" class="tiles">
    <div class="tile"><span class="label">Hit rate</span><span class="value" th:text="${@fmt.percent(stats.hitRate())}">0%</span>
        <span class="muted" th:text="|${stats.hits()} hits · ${stats.misses()} misses|">0 hits</span></div>
    <div class="tile"><span class="label">Saved</span><span class="value" th:text="${@fmt.bytes(stats.bytesServedFromCache())}">0 B</span>
        <span class="muted">served from the cache</span></div>
    <div class="tile"><span class="label">Downloaded</span><span class="value" th:text="${@fmt.bytes(stats.bytesDownloaded())}">0 B</span>
        <span class="muted">from upstreams</span></div>
    <div class="tile"><span class="label">Disk use</span><span class="value" th:text="${@fmt.bytes(stats.diskUsage())}">0 B</span>
        <span class="muted" th:text="|${stats.artifactCount()} files|">0 files</span></div>
    <div class="tile"><span class="label">Active downloads</span><span class="value" th:text="${stats.activeDownloads()}">0</span></div>
    <div class="tile wide" th:classappend="${stats.cacheAvailable()} ? '' : 'bad'">
        <span class="label">Cache folder</span>
        <span class="value" th:if="${stats.cacheAvailable()}" th:text="|${@fmt.bytes(stats.freeSpace())} free|">0 B free</span>
        <span class="value" th:unless="${stats.cacheAvailable()}">Unavailable</span>
        <span class="path" th:text="${stats.cacheDir()}">~/.localrepo/cache</span>
        <span class="muted" th:unless="${stats.cacheAvailable()}">Is its disk connected? Until it is, Gradle builds use their own repositories.</span>
    </div>
</div>
</body>
</html>
